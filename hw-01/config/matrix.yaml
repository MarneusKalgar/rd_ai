---
version: experiment-v1
models:
- id: provider-flash
  backend: openrouter
  model: google/gemini-3.5-flash
  serving_provider: google-ai-studio
- id: local
  backend: ollama
  model: gemma4:e4b-it-qat
  thinking: false
prompts:
- id: v1
  file: prompts/v1.txt
- id: v2
  file: prompts/v2.txt
sampling:
- id: baseline-16384
  temperature: 0.0
  top_p: 1.0
  max_output_tokens: 16384
- id: exploratory-16384
  temperature: 0.2
  top_p: 0.9
  max_output_tokens: 16384
execution:
  request_timeout_seconds: 1800.0
  input_timeout_seconds: 7205.0
  transport_retries: 1
  api_budget_usd: 10.0
  matrix_reserve_usd: 3.5
  dependency_failure_limit: 3
  backoff_initial_seconds: 1.0
  backoff_max_seconds: 30.0
selection:
  model_id: local
  prompt_id: v1
  sampling_id: baseline-16384
