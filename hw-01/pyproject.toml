[project]
name = "hw01-structured-extraction"
version = "0.1.0"
description = "Frozen purchase-order contract and structured extraction experiments"
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx>=0.28,<0.29",
    "jsonschema==4.25.1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "PyYAML>=6.0.3,<7",
]

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=9.1,<10",
    "ruff>=0.14,<1",
    "types-jsonschema>=4.25,<5",
    "types-PyYAML>=6.0.12,<7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.14"
files = ["src", "tests"]
strict = true
