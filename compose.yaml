name: rd-ai

x-ollama-image: &ollama-image ollama/ollama@sha256:265409e1d931028a8f7d5a32bcbafddd7bffbc6cc629d77efe9560adf692a5e7
x-app: &app
  build:
    context: .
    target: runtime
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  volumes:
    - results:/app/results

x-setup-environment: &setup-environment
  # Only these allowlisted values reach local helpers; app credentials stay separate.
  DI_SETUP_CONTEXT_LENGTH: ${DI_CONTEXT_LENGTH:-32768}
  DI_SETUP_WAIT_SECONDS: ${DI_SETUP_WAIT_SECONDS:-60}
  DI_SETUP_POLL_SECONDS: ${DI_SETUP_POLL_SECONDS:-1}
  DI_SETUP_REQUEST_SECONDS: ${DI_SETUP_REQUEST_SECONDS:-5}
  DI_SETUP_PULL_SECONDS: ${DI_SETUP_PULL_SECONDS:-1800}
  DI_SETUP_LOAD_SECONDS: ${DI_SETUP_LOAD_SECONDS:-300}
  DI_SETUP_KEEP_ALIVE_SECONDS: ${DI_SETUP_KEEP_ALIVE_SECONDS:-600}
  DI_SETUP_CAPACITY_SECONDS: ${DI_SETUP_CAPACITY_SECONDS:-900}
  DI_SETUP_MEASUREMENT_SECONDS: ${DI_SETUP_MEASUREMENT_SECONDS:-600}

x-local-environment: &local-environment
  <<: *setup-environment
  DI_OLLAMA_BASE_URL: http://ollama:11434
  DI_OLLAMA_MODE: docker
  DI_SETUP_IMAGE: *ollama-image

x-native-environment: &native-environment
  <<: *setup-environment
  DI_OLLAMA_BASE_URL: ${DI_NATIVE_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  DI_OLLAMA_MODE: native

services:
  # E02 has a separate private network/storage lifecycle; no host listener or keys.
  qdrant-e02:
    profiles: [retrieval]
    image: qdrant/qdrant@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    networks: [retrieval]
    volumes:
      - qdrant-e02:/qdrant/storage
    read_only: true
    tmpfs: [/tmp, /qdrant/snapshots]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"

  vector-e02:
    <<: *app
    profiles: [retrieval]
    networks: [retrieval]
    volumes:
      - ./results/submission:/app/results/submission
      - ./results/embedding-models:/app/results/embedding-models:ro
    mem_limit: 2g
    cpus: 2

  vector-e02-offline:
    <<: *app
    profiles: [retrieval]
    network_mode: none
    volumes:
      - ./results/submission:/app/results/submission
      - ./results/embedding-models:/app/results/embedding-models:ro
    mem_limit: 2g
    cpus: 2

  vector-e02-online:
    <<: *app
    profiles: [retrieval]
    # Model download only; no provider credentials or extraction ledger mount.
    volumes:
      - ./results/embedding-models:/app/results/embedding-models
    mem_limit: 2g

  offline:
    <<: *app
    network_mode: none

  # Host evidence is read-only. Only caches, isolated restores and compact indexes are writable.
  archive-offline:
    <<: *app
    network_mode: none
    volumes: &archive-volumes
      - ./results/submission:/app/results/submission:ro
      - ./results/archives:/app/results/archives
      - ./results/restored:/app/results/restored
      - ./archive-index:/app/archive-index

  archive-online:
    <<: *app
    volumes: *archive-volumes
    env_file:
      - path: .env.archive
        required: false

  # No named results volume, credentials or model dependencies: public evidence only.
  reproduce:
    <<: *app
    network_mode: none
    volumes:
      - ./results/archives:/app/results/archives:ro
      - ./results/restored:/app/results/restored
      - ./results/reproductions:/app/results/reproductions
      - ./archive-index:/app/archive-index:ro
      - ./REPORT.md:/app/REPORT.md:ro

  garage:
    profiles: [archive]
    build:
      context: .
      target: archive-store
    env_file:
      - path: .env.archive
        required: false
    volumes:
      - ./results/garage-config/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    ports:
      - "127.0.0.1:${DI_GARAGE_PORT:-3900}:3900"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    healthcheck:
      test: [CMD, /garage, status]
      interval: 2s
      timeout: 5s
      retries: 30

  checks:
    build:
      context: .
      target: checks
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  app:
    <<: *app
    environment: *local-environment
    # Inject app settings/credentials at runtime, never into images or local helpers.
    env_file:
      - path: .env
        required: false

  # Local inference deliberately has no provider credentials.
  local-run:
    <<: *app
    profiles: [local]
    environment: *local-environment
    depends_on:
      ollama:
        condition: service_healthy

  # The desktop app is independently owned; this service has no Ollama dependency.
  # It receives no provider dotenv file and never falls back to the Docker server.
  native-run:
    <<: *app
    profiles: [native]
    environment: *native-environment

  local-init:
    <<: *app
    profiles: [local]
    environment: *local-environment
    command: [python, -m, extraction_service.runtime, initialize]
    depends_on:
      ollama:
        condition: service_healthy

  local-ready:
    <<: *app
    profiles: [local]
    environment: *local-environment
    command: [python, -m, extraction_service.runtime, readiness]
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: *ollama-image
    profiles: [local]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: ${DI_CONTEXT_LENGTH:-32768}
      # Keep model work sequential for bounded memory and comparable experiments.
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_LOAD_TIMEOUT: 5m
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama-models:/root/.ollama
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Per-container ceiling; Docker Desktop's VM needs additional headroom.
    mem_limit: ${DI_OLLAMA_MEMORY_LIMIT:-7g}
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  qdrant-e02:
  # External names deliberately retain the original data/ledger identities.
  # Missing storage fails rather than creating an empty replacement.
  results:
    external: true
    name: rd-ai-hw01_results
  ollama-models:
    external: true
    name: rd-ai-hw01_ollama-models
  garage-data:
    external: true
    name: rd-ai-hw01_garage-data

networks:
  retrieval:
    internal: true
